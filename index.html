<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Entreno">
  <title>Mi Entreno</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="viewTitle">Hoy</h1>
    <span id="topDate" class="muted"></span>
  </header>

  <main id="view"></main>

  <div id="restBar" class="rest-bar hidden">
    <div class="rest-fill" id="restFill"></div>
    <span id="restText">Descanso</span>
    <button id="restAdd" class="chip">+15 s</button>
    <button id="restSkip" class="chip">Saltar</button>
  </div>

  <nav class="tabbar">
    <button data-tab="hoy" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hoy</span></button>
    <button data-tab="cardio"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>Cardio</span></button>
    <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Progreso</span></button>
    <button data-tab="peso"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9a4 4 0 0 1 8 0M12 9l1.5-2"/></svg><span>Peso</span></button>
    <button data-tab="mas"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Rutina</span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="routine.js"></script>
  <script src="app.js"></script>
</body>
</html>
